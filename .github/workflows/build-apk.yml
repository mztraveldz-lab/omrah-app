name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Build Capacitor Android App
      run: |
        npm install @capacitor/core@latest @capacitor/cli@latest
        mkdir -p www
        cp index.html www/
        cp -r duas.js app.js www/ 2>/dev/null || true
        npx cap init "رفيق المعتمر" "com.mztravel.omrah" --web-dir "www"
        npm install @capacitor/android@latest
        npx cap add android

    - name: Set Android Permissions
      run: |
        sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' android/app/src/main/AndroidManifest.xml

    - name: Build APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Omrah-App-Debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
