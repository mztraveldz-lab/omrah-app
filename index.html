<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>رفيق المعتمر</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --primary: #0f5132;
      --primary-dark: #0a3622;
      --accent: #d4af37;
      --bg: #0b1320;
      --card-bg: #162235;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #23354d;
      --danger: #ef4444;
      --success: #22c55e;
      --warning: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 30px; }
    .header { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--accent); position: sticky; top: 0; z-index: 1000; }
    .header h1 { font-size: 1.1rem; display: flex; align-items: center; gap: 8px; }
    .role-btn { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: #fff; padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; }
    .nav-tabs { display: flex; background: var(--card-bg); overflow-x: auto; border-bottom: 1px solid var(--border); scrollbar-width: none; }
    .nav-tabs::-webkit-scrollbar { display: none; }
    .tab-btn { flex: 0 0 auto; padding: 12px 16px; background: none; border: none; color: var(--text-muted); font-size: 0.9rem; font-weight: bold; cursor: pointer; border-bottom: 3px solid transparent; }
    .tab-btn.active { color: #38bdf8; border-bottom-color: #38bdf8; }
    .content-area { padding: 14px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    #map { height: 320px; width: 100%; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 14px; }
    .btn { width: 100%; padding: 10px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-warning { background: var(--warning); color: black; }
    .hotel-card { background: linear-gradient(135deg, #1e293b, #0f172a); border: 1px solid var(--accent); padding: 12px; border-radius: 10px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .badge { padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; }
    .badge-purple { background: #581c87; color: #e9d5ff; }
    .badge-amber { background: #78350f; color: #fde68a; }
    .badge-rose { background: #881337; color: #fecdd3; }
    .badge-makkah { background: #b45309; color: #fff; }
    .badge-madinah { background: #047857; color: #fff; }
    .filter-bar { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 12px; scrollbar-width: none; }
    .filter-chip { padding: 6px 12px; border-radius: 20px; background: #1e293b; border: 1px solid var(--border); color: var(--text-muted); font-size: 0.8rem; cursor: pointer; white-space: nowrap; }
    .filter-chip.active { background: #0284c7; color: #fff; border-color: #0284c7; }
    .story-box { background: rgba(15, 23, 42, 0.6); border-right: 4px solid #38bdf8; border-radius: 8px; padding: 12px; margin-top: 8px; line-height: 1.6; font-size: 0.9rem; }
    .dua-box { background: rgba(15, 23, 42, 0.6); border-right: 4px solid var(--accent); border-radius: 8px; padding: 12px; margin-top: 8px; line-height: 1.8; font-size: 0.95rem; color: #fef08a; }
    .user-row { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid var(--border); }
    .user-info { display: flex; align-items: center; gap: 8px; }
  </style>
</head>
<body>

  <div class="header">
    <h1 id="appTitle">🕋 رفيق المعتمر</h1>
    <button class="role-btn" id="roleToggleBtn" onclick="toggleRole()">تبديل الدور ⇄</button>
  </div>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="openTab('map-tab')">🗺️ خريطة وتتبع</button>
    <button class="tab-btn" onclick="openTab('tawaf-tab')">أدعية الطواف</button>
    <button class="tab-btn" onclick="openTab('sai-tab')">السعي والزيارة</button>
    <button class="tab-btn" onclick="openTab('bus-tab')">حقيبة الحافلة</button>
    <button class="tab-btn" onclick="openTab('ziyarat-tab')">موسوعة المزارات</button>
  </div>

  <div class="content-area">
    <!-- تبويب الخريطة والتتبع -->
    <div id="map-tab" class="tab-content active">
      <div id="hotelBanner" class="hotel-card" style="display: none;">
        <div>
          <div style="font-size: 0.8rem; color: var(--accent);">🏨 فندق الإقامة المعتمد</div>
          <div id="hotelName" style="font-weight: bold; margin-top: 2px;">لم يحدد بعد</div>
        </div>
        <button class="btn btn-warning" style="width: auto; padding: 6px 12px; font-size: 0.8rem;" onclick="navigateToHotel()">خذني للفندق 📍</button>
      </div>

      <div id="map"></div>

      <!-- لوحة تحكم المرشد -->
      <div id="guidePanel" class="card" style="display: none;">
        <h3 style="margin-bottom: 10px; color: #38bdf8;">🎛️ إدارة الفوج وتحديد الفندق</h3>
        <div style="display: flex; gap: 6px; margin-bottom: 10px;">
          <input type="text" id="hotelInput" placeholder="اسم فندق الفوج (مثال: فندق أجياد)..." style="flex: 1; padding: 8px; border-radius: 6px; border: 1px solid var(--border); background: #0f172a; color: #fff;">
          <button class="btn btn-primary" style="width: auto;" onclick="setHotelLocation()">حفظ موقعي كفندق 🏨</button>
        </div>
        <div style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px;">المعتمرون المتصلون: <span id="onlineCount">0</span></div>
        <div id="pilgrimsList"></div>
      </div>

      <!-- بطاقة المعتمر للتسجيل التلقائي -->
      <div id="pilgrimPanel" class="card">
        <h3 style="margin-bottom: 8px; color: #38bdf8;">👤 بيانات المعتمر</h3>
        <div style="display: flex; gap: 8px; margin-bottom: 10px;">
          <input type="text" id="pilgrimName" placeholder="اكتب اسمك الكامل..." style="flex: 1; padding: 8px; border-radius: 6px; border: 1px solid var(--border); background: #0f172a; color: #fff;">
          <input type="tel" id="pilgrimPhone" placeholder="رقم هاتفك..." style="flex: 1; padding: 8px; border-radius: 6px; border: 1px solid var(--border); background: #0f172a; color: #fff;">
        </div>
        <button class="btn btn-primary" onclick="savePilgrimData()">حفظ ومزامنة الموقع 📡</button>
      </div>
    </div>

    <!-- تبويب أدعية الطواف -->
    <div id="tawaf-tab" class="tab-content">
      <div id="tawafDuasList"></div>
    </div>

    <!-- تبويب السعي والزيارة -->
    <div id="sai-tab" class="tab-content">
      <div id="saiDuasList"></div>
    </div>

    <!-- تبويب حقيبة الحافلة -->
    <div id="bus-tab" class="tab-content">
      <div class="filter-bar">
        <button class="filter-chip active" onclick="filterLessons('all', this)">الكل</button>
        <button class="filter-chip" onclick="filterLessons('أخلاق', this)">🤝 الأخلاق واللحمة</button>
        <button class="filter-chip" onclick="filterLessons('تنظيم', this)">🧳 المطار والتسكين</button>
        <button class="filter-chip" onclick="filterLessons('صلاة', this)">🕌 الصلاة والجنائز</button>
      </div>
      <div id="lessonsList"></div>
    </div>

    <!-- تبويب موسوعة المزارات -->
    <div id="ziyarat-tab" class="tab-content">
      <div class="filter-bar">
        <button class="filter-chip active" onclick="filterZiyarat('all', this)">كل المزارات 📖</button>
        <button class="filter-chip" onclick="filterZiyarat('مكة', this)">🕋 مكة والمشاعر</button>
        <button class="filter-chip" onclick="filterZiyarat('المدينة', this)">🕌 المدينة المنورة</button>
      </div>
      <div id="ziyaratList"></div>
    </div>
  </div>

  <!-- استدعاء ملفات البيانات المقسمة -->
  <script src="duas.js"></script>
  <script src="content.js"></script>

  <script>
    const SERVER_URL = "http://89.117.60.222:3000";
    let isGuide = false;
    let currentHotel = null;
    let map, markers = {};

    function initMap() {
      map = L.map('map').setView([21.4225, 39.8262], 14);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
      }).addTo(map);
    }

    function openTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      event.currentTarget.classList.add('active');
      if (tabId === 'map-tab' && map) setTimeout(() => map.invalidateSize(), 200);
    }

    function toggleRole() {
      if (!isGuide) {
        const pass = prompt("أدخل رمز المرشد:");
        if (pass === "7788") {
          isGuide = true;
          document.getElementById('appTitle').innerText = "🕋 لوحة تحكم المرشد";
          document.getElementById('guidePanel').style.display = "block";
          document.getElementById('pilgrimPanel').style.display = "none";
        } else {
          alert("رمز غير صحيح!");
        }
      } else {
        isGuide = false;
        document.getElementById('appTitle').innerText = "🕋 رفيق المعتمر";
        document.getElementById('guidePanel').style.display = "none";
        document.getElementById('pilgrimPanel').style.display = "block";
      }
    }

    function renderDuas() {
      if (typeof tawafDuas !== 'undefined') {
        const tBox = document.getElementById('tawafDuasList');
        tBox.innerHTML = tawafDuas.map(d => `
          <div class="card">
            <h4 style="color: #38bdf8; margin-bottom: 6px;">${d.title}</h4>
            <div class="dua-box">${d.dua}</div>
          </div>
        `).join('');
      }

      if (typeof saiDuas !== 'undefined') {
        const sBox = document.getElementById('saiDuasList');
        sBox.innerHTML = saiDuas.map(d => `
          <div class="card">
            <h4 style="color: #38bdf8; margin-bottom: 6px;">${d.shawt}</h4>
            <div class="dua-box">${d.dua}</div>
          </div>
        `).join('');
      }
    }

    function renderLessons(filter = 'all') {
      if (typeof lessonsData === 'undefined') return;
      const box = document.getElementById('lessonsList');
      const items = filter === 'all' ? lessonsData : lessonsData.filter(l => l.category === filter);
      box.innerHTML = items.map(l => `
        <div class="card">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <span class="badge ${l.badge}">${l.category}</span>
            <span style="font-size: 0.75rem; color: var(--text-muted);">${l.time}</span>
          </div>
          <h3 style="font-size: 1rem; margin-bottom: 8px; color: #fff;">${l.title}</h3>
          <div class="story-box">${l.content}</div>
        </div>
      `).join('');
    }

    function filterLessons(cat, el) {
      document.querySelectorAll('#bus-tab .filter-chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      renderLessons(cat);
    }

    function renderZiyarat(city = 'all') {
      if (typeof ziyaratData === 'undefined') return;
      const box = document.getElementById('ziyaratList');
      const items = city === 'all' ? ziyaratData : ziyaratData.filter(z => z.city === city);
      box.innerHTML = items.map(z => `
        <div class="card">
          <div style="margin-bottom: 6px;">
            <span class="badge ${z.city === 'مكة' ? 'badge-makkah' : 'badge-madinah'}">${z.city === 'مكة' ? 'مكة المكرمة' : 'المدينة المنورة'}</span>
          </div>
          <h3 style="font-size: 1rem; margin-bottom: 6px; color: #fff;">📍 ${z.title}</h3>
          <div class="story-box">${z.story}</div>
        </div>
      `).join('');
    }

    function filterZiyarat(city, el) {
      document.querySelectorAll('#ziyarat-tab .filter-chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      renderZiyarat(city);
    }

    async function syncTracking() {
      try {
        const res = await fetch(`${SERVER_URL}/api/locations`);
        if (!res.ok) return;
        const data = await res.json();
        
        if (data.hotel && data.hotel.lat) {
          currentHotel = data.hotel;
          document.getElementById('hotelBanner').style.display = "flex";
          document.getElementById('hotelName').innerText = data.hotel.name || "فندق الفوج المعتمد";
        }

        if (isGuide && data.pilgrims) {
          document.getElementById('onlineCount').innerText = data.pilgrims.length;
          const list = document.getElementById('pilgrimsList');
          list.innerHTML = data.pilgrims.map(p => `
            <div class="user-row">
              <div class="user-info">
                <span>👤</span>
                <div>
                  <div style="font-weight: bold; font-size: 0.9rem;">${p.name || 'معتمر'}</div>
                  <div style="font-size: 0.75rem; color: var(--text-muted);">${p.phone || 'بدون رقم'}</div>
                </div>
              </div>
              <div style="display: flex; gap: 6px; align-items: center;">
                <span class="badge" style="background: #334155;">🔋 ${p.battery || 100}%</span>
                ${p.phone ? `<a href="tel:${p.phone}" class="btn btn-primary" style="width: auto; padding: 4px 8px; font-size: 0.8rem; text-decoration: none;">📞</a>` : ''}
              </div>
            </div>
          `).join('');
        }
      } catch (e) {
        console.error("فشل المزامنة:", e);
      }
    }

    function savePilgrimData() {
      const name = document.getElementById('pilgrimName').value;
      const phone = document.getElementById('pilgrimPhone').value;
      if (!name) return alert("يرجى كتابة الاسم");
      localStorage.setItem('pilgrim_name', name);
      localStorage.setItem('pilgrim_phone', phone);
      sendLocation();
      alert("تم الحفظ بنجاح!");
    }

    async function sendLocation() {
      if (!navigator.geolocation) return;
      navigator.geolocation.getCurrentPosition(async (pos) => {
        let batteryLevel = 100;
        if (navigator.getBattery) {
          const b = await navigator.getBattery();
          batteryLevel = Math.round(b.level * 100);
        }
        const payload = {
          name: localStorage.getItem('pilgrim_name') || 'معتمر',
          phone: localStorage.getItem('pilgrim_phone') || '',
          lat: pos.coords.latitude,
          lng: pos.coords.longitude,
          battery: batteryLevel
        };
        fetch(`${SERVER_URL}/api/update-location`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        }).catch(err => console.log(err));
      });
    }

    function navigateToHotel() {
      if (!currentHotel) return;
      window.open(`https://www.google.com/maps/dir/?api=1&destination=${currentHotel.lat},${currentHotel.lng}`);
    }

    async function setHotelLocation() {
      const name = document.getElementById('hotelInput').value || "فندق الفوج";
      navigator.geolocation.getCurrentPosition(async (pos) => {
        await fetch(`${SERVER_URL}/api/set-hotel`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, lat: pos.coords.latitude, lng: pos.coords.longitude })
        });
        alert("تم تعيين موقع الفندق بنجاح لجميع المعتمرين!");
        syncTracking();
      });
    }

    window.onload = () => {
      initMap();
      renderDuas();
      renderLessons('all');
      renderZiyarat('all');
      syncTracking();
      setInterval(syncTracking, 10000);
      setInterval(sendLocation, 20000);
    };
  </script>
</body>
</html>
